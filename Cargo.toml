[workspace]
resolver = "2"
members = [
    "crates/nle-core",
    "crates/nle-effects",
    "crates/nle-premiere",
    "crates/nle-resolve",
    "crates/nle-interchange",
    "crates/nle-cli",
    "crates/nle-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
nle-core = { path = "crates/nle-core" }
nle-effects = { path = "crates/nle-effects" }
nle-premiere = { path = "crates/nle-premiere" }
nle-resolve = { path = "crates/nle-resolve" }
nle-interchange = { path = "crates/nle-interchange" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
ruzstd = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
base64 = "0.22"
regex = "1"
clap = { version = "4", features = ["derive"] }

[package]
name = "aagedal-nle-converter-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop GUI for Aagedal NLE Project Converter"

[lib]
name = "aagedal_nle_converter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nle-core.workspace = true
nle-effects.workspace = true
nle-premiere.workspace = true
nle-resolve.workspace = true
nle-interchange.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
